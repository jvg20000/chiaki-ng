name: MCP Publish

on:
  push:
    branches: [main, develop]
    paths:
      - "mcp/**"
  workflow_dispatch:

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: version
        run: |
          CURRENT=$(node -p "require('./mcp/package.json').version")
          PREVIOUS=$(git show HEAD~1:mcp/package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version" 2>/dev/null || echo "none")
          echo "current=${CURRENT}" >> $GITHUB_OUTPUT
          echo "previous=${PREVIOUS}" >> $GITHUB_OUTPUT
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Version changed: ${PREVIOUS} → ${CURRENT}"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⏭️  Version unchanged (${CURRENT}), skipping publish"
          fi

  build:
    name: Build
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      - name: Package tarball
        run: npm pack --pack-destination ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: chiaki-mcp-${{ needs.check-version.outputs.version }}
          path: mcp/dist/chiaki-mcp-*.tgz

  publish-npm:
    name: Publish to npm
    needs: build
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/chiaki-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
        working-directory: mcp
      - run: npm run build
        working-directory: mcp
      - name: Publish
        run: npm publish --access public
        working-directory: mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true  # No bloquea si no hay token npm configurado

  github-release:
    name: GitHub Release
    needs: build
    if: needs.check-version.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chiaki-mcp-${{ needs.check-version.outputs.version }}
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mcp-v${{ needs.check-version.outputs.version }}
          name: "chiaki-mcp v${{ needs.check-version.outputs.version }}"
          body: "Release automática de chiaki-mcp v${{ needs.check-version.outputs.version }}. Generada al hacer merge a main."
          files: dist/*.tgz
          draft: false
          prerelease: ${{ github.ref == 'refs/heads/develop' }}
