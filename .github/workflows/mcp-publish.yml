name: MCP Publish

on:
  push:
    tags: ['mcp-v*']
  workflow_dispatch:

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      npm_version: ${{ steps.version.outputs.npm_version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      title: ${{ steps.version.outputs.title }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set version and tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Extraer versión del tag: mcp-v1.1.0 → 1.1.0, mcp-v1.1.0-dev-abc1234 → 1.1.0
          VERSION=$(echo "$TAG" | sed -E 's/^mcp-v//; s/-dev-.*//; s/-rc.*//; s/-beta.*//; s/-alpha.*//')
          SHORT_SHA="${GITHUB_SHA::7}"

          # Determinar si es pre-release
          if echo "$TAG" | grep -qE '\-dev\-|\-rc|\-beta|\-alpha'; then
            NPM_VERSION="${VERSION}-dev.${SHORT_SHA}"
            PRERELEASE="true"
            TITLE="[DEVELOP] chiaki-mcp v${VERSION} (${SHORT_SHA})"
          else
            NPM_VERSION="${VERSION}"
            PRERELEASE="false"
            TITLE="chiaki-mcp v${VERSION}"
          fi

          echo "publish=true" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "npm_version=${NPM_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT

  build:
    name: Build
    needs: check-version
    if: needs.check-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      - name: Package tarball
        run: |
          mkdir -p dist
          npm pack --pack-destination dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.check-version.outputs.tag }}
          path: mcp/dist/*.tgz

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"

      - name: Set dev version (if pre-release)
        if: needs.check-version.outputs.prerelease == 'true'
        run: |
          npm version ${{ needs.check-version.outputs.npm_version }} --no-git-tag-version
        working-directory: mcp

      - run: npm ci
        working-directory: mcp
      - run: npm run build
        working-directory: mcp

      - name: Publish
        run: |
          if [ "${{ needs.check-version.outputs.prerelease }}" = "true" ]; then
            npm publish --tag dev
          else
            npm publish
          fi
        working-directory: mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    name: GitHub Release
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.check-version.outputs.tag }}
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: ${{ needs.check-version.outputs.title }}
          prerelease: ${{ needs.check-version.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*.tgz
