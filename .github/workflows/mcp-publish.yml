name: MCP Publish

on:
  push:
    branches: [main]
    paths:
      - "mcp/**"
  workflow_dispatch:

jobs:
  # ── Check version change ──
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: version
        run: |
          CURRENT=$(node -p "require('./mcp/package.json').version")
          PREVIOUS=$(git show HEAD~1:mcp/package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version" 2>/dev/null || echo "none")
          echo "current=${CURRENT}" >> $GITHUB_OUTPUT
          echo "previous=${PREVIOUS}" >> $GITHUB_OUTPUT
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Version changed: ${PREVIOUS} → ${CURRENT}"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⏭️  Version unchanged (${CURRENT}), skipping publish"
          fi

  # ── Build ──
  build:
    name: Build
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      - name: Package tarball
        run: |
          npm pack --pack-destination ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: chiaki-mcp-${{ needs.check-version.outputs.version }}
          path: mcp/dist/chiaki-mcp-*.tgz*  # catch both npm pack output patterns
