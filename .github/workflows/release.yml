name: Build and Release

on:
  push:
    branches: [main, develop]

jobs:
  # ── Metadata + Create Release ──────────────────────────────────────
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set release metadata
        id: meta
        run: |
          VERSION_MAJOR="$(grep 'CHIAKI_VERSION_MAJOR' CMakeLists.txt | grep -Eo '[0-9]+' | head -1)"
          VERSION_MINOR="$(grep 'CHIAKI_VERSION_MINOR' CMakeLists.txt | grep -Eo '[0-9]+' | head -1)"
          VERSION_PATCH="$(grep 'CHIAKI_VERSION_PATCH' CMakeLists.txt | grep -Eo '[0-9]+' | head -1)"
          VERSION="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          BRANCH="${GITHUB_REF_NAME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "$BRANCH" = "main" ]; then
            TAG="v${VERSION}-${SHORT_SHA}"
            PRERELEASE="false"
            TITLE="Build v${VERSION} (${SHORT_SHA})"
          else
            TAG="v${VERSION}-dev-${SHORT_SHA}"
            PRERELEASE="true"
            TITLE="[DEVELOP] Build v${VERSION} (${SHORT_SHA})"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Linux (devcontainer) ───────────────────────────────────────────
  build-linux:
    name: Linux (devcontainer)
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build devcontainer image
        run: docker build -t chiaki-devcontainer -f .devcontainer/Dockerfile .devcontainer/

      - name: Configure & Build
        run: |
          mkdir -p build
          docker run --rm -u root \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            chiaki-devcontainer bash -c "
              cd build && \
              cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCHIAKI_ENABLE_TESTS=OFF \
                -DCHIAKI_ENABLE_CLI=ON \
                -DCHIAKI_ENABLE_GUI=ON && \
              ninja -j\$(nproc)
            "

      - name: Package
        run: |
          V="${{ needs.create-release.outputs.version }}"
          S="${{ needs.create-release.outputs.short_sha }}"
          ARTIFACT="chiaki-ng-linux-x64-v${V}-${S}.tar.gz"
          mkdir -p dist
          cp build/gui/chiaki build/cli/chiaki-cli dist/
          cd dist && tar czf ../"${ARTIFACT}" .
          echo "artifact_name=${ARTIFACT}" >> $GITHUB_ENV

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: ${{ env.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Windows (MSYS2) ────────────────────────────────────────────────
  build-windows:
    name: Windows (MSYS2)
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            fast_float:p
            fftw:p
            hidapi:p
            json-c:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p
            libevent:p

      - name: Install tools
        run: |
          pip install protobuf
          pacman -S git make unzip zip --noconfirm

      - name: Build libplacebo
        run: scripts/build-libplacebo-windows.sh

      - name: Setup ffmpeg
        run: |
          curl -LO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          unzip ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/bin/." /mingw64/bin
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/include/." /mingw64/include
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/lib/." /mingw64/lib

      - name: Build sdl2-compat
        run: |
          INSTALL_PREFIX=/mingw64 scripts/build-sdl2-compat.sh .
          cp /mingw64/lib/pkgconfig/sdl2-compat.pc /mingw64/lib/pkgconfig/sdl2.pc

      - name: Configure & Build
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF
          cmake --build build --config Release --target chiaki

      - name: Deploy
        run: |
          ./scripts/deploy-windows-msys2.sh chiaki-ng-Win build/gui/chiaki.exe \
            "${{ github.workspace }}/build/third-party/cpp-steam-tools" /mingw64 gui/src/qml

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ needs.create-release.outputs.version }}"
          $sha = "${{ needs.create-release.outputs.short_sha }}"
          $artifact = "chiaki-ng-win-x64-v${ver}-${sha}.zip"
          Compress-Archive -Path chiaki-ng-Win -DestinationPath $artifact
          echo "artifact_name=$artifact" >> $env:GITHUB_ENV

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: ${{ env.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── macOS ARM ──────────────────────────────────────────────────────
  build-macos-arm:
    name: macOS ARM
    needs: create-release
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps
        run: |
          pip3 install --user 'protobuf>=5,<6' --break-system-packages
          brew update
          brew uninstall pkgconfig || true
          brew install qt@6 ffmpeg pkgconfig opus openssl cmake ninja nasm \
            protobuf@29 speexdsp libplacebo wget python-setuptools json-c \
            miniupnpc libevent

      - name: Build sdl2-compat
        run: |
          sudo INSTALL_PREFIX=/usr/local scripts/build-sdl2-compat.sh
          sudo cp /usr/local/lib/pkgconfig/sdl2-compat.pc /usr/local/lib/pkgconfig/sdl2.pc

      - name: Configure & Build
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release \
            -DCHIAKI_ENABLE_CLI=OFF -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)/opt/openssl@3;$(brew --prefix)/opt/qt@6;$(brew --prefix)/opt/protobuf@29"
          export CPATH=$(brew --prefix)/opt/ffmpeg/include
          cmake --build build --config Release --target chiaki

      - name: Deploy & Package DMG
        run: |
          cp -a build/gui/chiaki.app chiaki-ng.app
          cp scripts/qtwebengine_import.qml gui/src/qml/ 2>/dev/null || true
          $(brew --prefix)/opt/qt@6/bin/macdeployqt chiaki-ng.app \
            -qmldir="$PWD/gui/src/qml" -libpath=$(brew --prefix)/lib
          mkdir -p chiaki-ng.app/Contents/Resources/vulkan/icd.d
          wget -q https://github.com/KhronosGroup/MoltenVK/releases/download/v1.2.9/MoltenVK-macos.tar
          tar xf MoltenVK-macos.tar
          cp MoltenVK/MoltenVK/dylib/macOS/* chiaki-ng.app/Contents/Resources/vulkan/icd.d
          $(brew --prefix)/opt/qt@6/bin/macdeployqt chiaki-ng.app \
            -qmldir="$PWD/gui/src/qml" -libpath=$(brew --prefix)/lib
          cp /usr/local/lib/libSDL3.dylib chiaki-ng.app/Contents/MacOS/libSDL3.dylib 2>/dev/null || true
          cp /usr/local/lib/libSDL2-2.0.0.dylib chiaki-ng.app/Contents/MacOS/libSDL2-2.0.0.dylib 2>/dev/null || true
          ln -sf libvulkan.1.dylib chiaki-ng.app/Contents/Frameworks/vulkan 2>/dev/null || true
          codesign --force --entitlements gui/entitlements.xml --deep --sign - chiaki-ng.app
          V="${{ needs.create-release.outputs.version }}"
          S="${{ needs.create-release.outputs.short_sha }}"
          ARTIFACT="chiaki-ng-macos-arm64-v${V}-${S}.dmg"
          hdiutil create -srcfolder chiaki-ng.app "${ARTIFACT}"
          echo "artifact_name=${ARTIFACT}" >> $GITHUB_ENV

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: ${{ env.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── macOS Intel ────────────────────────────────────────────────────
  build-macos-x64:
    name: macOS Intel
    needs: create-release
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps
        run: |
          pip3 install --user 'protobuf>=5,<6' --break-system-packages
          brew update
          brew install --force qt@6 ffmpeg pkgconfig opus openssl cmake ninja nasm \
            protobuf@29 speexdsp libplacebo wget python-setuptools json-c \
            miniupnpc libevent || true

      - name: Build sdl2-compat
        run: |
          sudo INSTALL_PREFIX=/usr/local scripts/build-sdl2-compat.sh
          sudo cp /usr/local/lib/pkgconfig/sdl2-compat.pc /usr/local/lib/pkgconfig/sdl2.pc

      - name: Configure & Build
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release \
            -DCHIAKI_ENABLE_CLI=OFF -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)/opt/openssl@3;$(brew --prefix)/opt/qt@6;$(brew --prefix)/opt/protobuf@29"
          export CPATH=$(brew --prefix)/opt/ffmpeg/include
          cmake --build build --config Release --target chiaki

      - name: Deploy & Package DMG
        run: |
          cp -a build/gui/chiaki.app chiaki-ng.app
          cp scripts/qtwebengine_import.qml gui/src/qml/ 2>/dev/null || true
          $(brew --prefix)/opt/qt@6/bin/macdeployqt chiaki-ng.app \
            -qmldir="$PWD/gui/src/qml" -libpath=$(brew --prefix)/lib
          mkdir -p chiaki-ng.app/Contents/Resources/vulkan/icd.d
          wget -q https://github.com/KhronosGroup/MoltenVK/releases/download/v1.2.9/MoltenVK-macos.tar
          tar xf MoltenVK-macos.tar
          cp MoltenVK/MoltenVK/dylib/macOS/* chiaki-ng.app/Contents/Resources/vulkan/icd.d
          $(brew --prefix)/opt/qt@6/bin/macdeployqt chiaki-ng.app \
            -qmldir="$PWD/gui/src/qml" -libpath=$(brew --prefix)/lib
          cp /usr/local/lib/libSDL3.dylib chiaki-ng.app/Contents/MacOS/libSDL3.dylib 2>/dev/null || true
          cp /usr/local/lib/libSDL2-2.0.0.dylib chiaki-ng.app/Contents/MacOS/libSDL2-2.0.0.dylib 2>/dev/null || true
          ln -sf libvulkan.1.dylib chiaki-ng.app/Contents/Frameworks/vulkan 2>/dev/null || true
          codesign --force --entitlements gui/entitlements.xml --deep --sign - chiaki-ng.app
          V="${{ needs.create-release.outputs.version }}"
          S="${{ needs.create-release.outputs.short_sha }}"
          ARTIFACT="chiaki-ng-macos-x64-v${V}-${S}.dmg"
          hdiutil create -srcfolder chiaki-ng.app "${ARTIFACT}"
          echo "artifact_name=${ARTIFACT}" >> $GITHUB_ENV

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: ${{ env.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── AppImage x64 (Podman) ──────────────────────────────────────────
  build-appimage-x64:
    name: AppImage x64
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Setup Podman
        run: |
          sudo apt update
          sudo apt-get -y install podman

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: chiaki-ng

      - name: Add QmlWebEngine Import
        working-directory: chiaki-ng
        run: cp scripts/qtwebengine_import.qml gui/src/qml/

      - name: Build AppImage
        working-directory: chiaki-ng
        run: |
          set -xe
          podman run --rm \
            -v "`pwd`:/build/chiaki" \
            -w "/build/chiaki" \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            -t docker.io/streetpea/chiaki-ng-builder:qt6.9 \
            /bin/bash -c "sudo -E scripts/build-appimage.sh /build/appdir"
          V="${{ needs.create-release.outputs.version }}"
          S="${{ needs.create-release.outputs.short_sha }}"
          ARTIFACT="chiaki-ng-appimage-x64-v${V}-${S}.AppImage"
          cp appimage/chiaki-ng.AppImage "${ARTIFACT}"
          echo "artifact_name=${ARTIFACT}" >> $GITHUB_ENV

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: chiaki-ng/${{ env.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── AppImage ARM64 (Podman) ────────────────────────────────────────
  build-appimage-arm64:
    name: AppImage ARM64
    needs: create-release
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Setup Podman
        run: |
          sudo apt update
          sudo apt-get -y install podman

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: chiaki-ng

      - name: Add QmlWebEngine Import
        working-directory: chiaki-ng
        run: cp scripts/qtwebengine_import.qml gui/src/qml/

      - name: Build AppImage
        working-directory: chiaki-ng
        run: |
          set -xe
          podman run --rm \
            -v "`pwd`:/build/chiaki" \
            -w "/build/chiaki" \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            -t docker.io/streetpea/chiaki-ng-builder:qt6.7 \
            /bin/bash -c "sudo -E scripts/build-appimage.sh /build/appdir"
          V="${{ needs.create-release.outputs.version }}"
          S="${{ needs.create-release.outputs.short_sha }}"
          ARTIFACT="chiaki-ng-appimage-arm64-v${V}-${S}.AppImage"
          cp appimage/chiaki-ng.AppImage "${ARTIFACT}"
          echo "artifact_name=${ARTIFACT}" >> $GITHUB_ENV

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: chiaki-ng/${{ env.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
